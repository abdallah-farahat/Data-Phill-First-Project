<svg viewBox="0 0 1350 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1117"/>
      <stop offset="100%" stop-color="#0B0D12"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1350" height="460" fill="url(#bg)" rx="16"/>

  <!-- Title & Subtitle -->
  <text x="675" y="40" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" letter-spacing="3">OLIST DATA WAREHOUSE — ENTERPRISE PIPELINE ARCHITECTURE</text>
  <text x="675" y="65" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" letter-spacing="1">Powered by End-to-End Centralized Audit Logging &amp; Lineage Tracking</text>

  <!-- Connecting Flow Lines -->
  <g stroke="#334155" stroke-width="2.5" stroke-dasharray="6,6" fill="none">
    <line x1="240" y1="210" x2="270" y2="210" />
    <line x1="500" y1="210" x2="530" y2="210" />
    <line x1="760" y1="210" x2="790" y2="210" />
    <line x1="1020" y1="210" x2="1050" y2="210" />
