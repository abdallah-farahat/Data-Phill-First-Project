  <!-- ================= GLOBAL AUDIT BANNER ================= -->
  <g transform="translate(30, 375)">
    <rect width="1250" height="50" rx="10" fill="#1F242C" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="625" y="30" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
