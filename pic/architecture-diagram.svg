  <!-- ================= CARD 1: RAW ================= -->
  <g transform="translate(30, 90)">
    <rect width="210" height="260" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <rect width="210" height="40" rx="12" fill="#21262D"/>
    <text x="15" y="25" fill="#58A6FF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">01. RAW SOURCES</text>
    
    <g fill="#C9D1D9" font-family="system-ui, sans-serif" font-size="12">
      <text x="20" y="75">📁 11 Disconnected Files</text>
      <text x="20" y="110">🔗 CRM &amp; ERP Data</text>
      <text x="20" y="145">⚠️ Zero Relationships</text>
      <text x="20" y="180">❌ Unstructured Raw</text>
      <text x="20" y="215">📥 Landing Zone</text>
    </g>
  </g>

  <!-- ================= CARD 2: STAGING & BRONZE ================= -->
  <g transform="translate(290, 90)">
    <rect width="210" height="260" rx="12" fill="#161B22" stroke="#CD7F32" stroke-width="1.5" filter="url(#glow)"/>
    <rect width="210" height="40" rx="12" fill="#21262D"/>
    <text x="15" y="25" fill="#CD7F32" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">02. STAGING &amp; BRONZE</text>
    
    <g fill="#C9D1D9" font-family="system-ui, sans-serif" font-size="12">
      <text x="20" y="75">📥 Staging BULK INSERT</text>
      <text x="20" y="110">🔄 Incremental Load</text>
      <text x="20" y="145">📜 Full History Vault</text>
      <text x="20" y="180">🏷️ Batch_Id Tracking</text>
      <text x="20" y="215">🛡️ Audit Logged</text>
    </g>
  </g>

  <!-- ================= CARD 3: SILVER ================= -->
  <g transform="translate(550, 90)">
    <rect width="210" height="260" rx="12" fill="#161B22" stroke="#8B949E" stroke-width="1.5"/>
    <rect width="210" height="40" rx="12" fill="#21262D"/>
    <text x="15" y="25" fill="#C9D1D9" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">03. SILVER LAYER</text>
    
    <g fill="#C9D1D9" font-family="system-ui, sans-serif" font-size="12">
