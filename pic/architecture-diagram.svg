      <text x="20" y="110">🛠️ Fn_Correct_Known_City</text>
      <text x="20" y="145">🔍 Geo-Typo Fixes</text>
      <text x="20" y="180">🔑 Composite Keys</text>
      <text x="20" y="215">🛡️ Audit Logged</text>
    </g>
  </g>

  <!-- ================= CARD 4: GOLD ================= -->
  <g transform="translate(810, 90)">
    <rect width="210" height="260" rx="12" fill="#161B22" stroke="#F2C811" stroke-width="2" filter="url(#glow)"/>
    <rect width="210" height="40" rx="12" fill="#21262D"/>
    <text x="15" y="25" fill="#F2C811" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">04. GOLD LAYER</text>
    
    <g fill="#C9D1D9" font-family="system-ui, sans-serif" font-size="12">
      <text x="20" y="75">⭐ Star Schema Model</text>
      <text x="20" y="110">🔄 MERGE &amp; CDC Tracking</text>
      <text x="20" y="145">⏳ SCD Type 2 History</text>
      <text x="20" y="180">⚡ Columnstore &amp; Partitions</text>
      <text x="20" y="215">🛡️ Audit Logged</text>
    </g>
  </g>

  <!-- ================= CARD 5: POWER BI ================= -->
  <g transform="translate(1070, 90)">
    <rect width="210" height="260" rx="12" fill="#161B22" stroke="#F2C811" stroke-width="1.5"/>
    <rect width="210" height="40" rx="12" fill="#21262D"/>
    <text x="15" y="25" fill="#F2C811" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">05. POWER BI</text>
    
    <g fill="#C9D1D9" font-family="system-ui, sans-serif" font-size="12">
      <text x="20" y="75">📊 Interactive Dashboards</text>
      <text x="20" y="110">📦 99.4K Orders Tracked</text>
      <text x="20" y="145">💰 R$13M Revenue</text>
      <text x="20" y="180">🚀 Enterprise Speed</text>
      <text x="20" y="215">🎯 Single Source of Truth</text>
    </g>
